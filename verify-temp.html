<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>V</title></head><body>
<pre id="log">START
</pre>
<script>
const el=document.getElementById('log');
const log=(...a)=>{el.textContent+=a.map(x=>typeof x==='string'?x:String(x)).join(' ')+'\n';};
window.onerror=(m)=>log('ERR',m);
window.onunhandledrejection=e=>log('REJ',e.reason&&e.reason.message||e.reason);
</script>
<script src="ort/ort.min.js"></script>
<script src="infer.js"></script>
<script>
(async()=>{
  try{
    await initModel(); await loadKnowledge();
    log('READY threads='+ort.env.wasm.numThreads);
    // build a tiny in-memory test image via canvas (solid green) - just need inference to run
    const c=document.createElement('canvas');c.width=224;c.height=224;
    const ctx=c.getContext('2d');ctx.fillStyle='#3a7d2c';ctx.fillRect(0,0,224,224);
    const r=await predict(c);
    log('PREDICT_OK top='+(r.top.class||r.top.name_zh)+' conf='+r.top.confidence);
    log('DONE_OK');
  }catch(e){log('FAIL '+(e&&e.message||e));log('DONE_FAIL');}
})();
</script>
</body></html>
